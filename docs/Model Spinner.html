<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Status Feedback Spinner</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 100px;
    }

    button {
        padding: 10px 20px;
        margin: 10px;
        font-size: 16px;
        cursor: pointer;
    }

    /* Modal Background */
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
    }

    /* Modal Content */
    .modal-content {
        background: white;
        padding: 40px;
        border-radius: 10px;
        text-align: center;
        width: 300px;
    }

    /* Spinner */
    .spinner {
        border: 6px solid #f3f3f3;
        border-top: 6px solid #3498db;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px auto;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .status-text {
        font-size: 16px;
        font-weight: bold;
    }
</style>
</head>
<body>

<h2>Status Feedback Example</h2>

<button onclick="startUpload()">Upload</button>
<button onclick="startExport()">Export</button>

<!-- Modal -->
<div id="statusModal" class="modal">
    <div class="modal-content">
        <div class="spinner"></div>
        <div id="statusText" class="status-text">Processing...</div>
    </div>
</div>

<script>
    const modal = document.getElementById("statusModal");
    const statusText = document.getElementById("statusText");

    function showModal(message) {
        statusText.innerText = message;
        modal.style.display = "flex";
    }

    function hideModal() {
        modal.style.display = "none";
    }

     async function startUpload() {
        showModal("Uploading file...");

        // Simulate upload process
        setTimeout(() => {
            statusText.innerText = "Upload Complete!";
            setTimeout(hideModal, 1000);
        }, 3000);
    }

    function startExport() {
        showModal("Exporting data...");

        // Simulate export process
        setTimeout(() => {
            statusText.innerText = "Export Complete!";
            setTimeout(hideModal, 1000);
        }, 3000);
    }
</script>

</body>
</html>
